name: ftv
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  
  # 本地 QuickJS 引擎
  flutter_qjs:
    path: ../flutter_qjs

  # 核心网络与文件解压/选择器
  dio: ^5.7.0
  file_picker: ^13.2.0
  path_provider: ^2.1.5
  archive: ^4.0.2

  # 视频播放器内核（media_kit 跨平台原生多媒体方案）
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_linux: ^1.1.0
  media_kit_libs_ios_video: ^1.1.4

  # 系统通知中心媒体播控卡片插件 (保留现代插件，零构建冲突)
  flutter_media_session: ^2.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/quickjs/assets/js/lib/